[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*

# xfail_strict turns an unexpectedly-passing xfail into a failure, so the
# wave-power discrepancy test starts failing the moment the underlying bug is
# fixed and its marker goes stale.
xfail_strict = true

addopts =
    --strict-markers
    --strict-config
    -ra
